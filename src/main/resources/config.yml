# Zusaetzliche Lore aus dem Resourcepack: Badge-Glyphen (Font northsoft:badges)
# und der Tooltip-Rahmen je Seltenheit. Beides laesst sich einzeln abschalten.
lore:
  badges: true
  tooltip-style: true

# Booster-Packs. Rechtsklick startet den MythicMobs-Skill, der die Karten verteilt.
# Die custom-model-data muss zum Eintrag in assets/minecraft/items/paper.json passen.
packs:
  mortal_monsters:
    material: PAPER
    custom-model-data: 632000
    mythic-skill: nm_pack_open_mortal_monsters
    display: '&5Mortal Monsters &fBooster Pack'
    consume-on-success: true
    cooldown-milliseconds: 500
  nascent_nature:
    material: PAPER
    custom-model-data: 633000
    mythic-skill: nm_pack_open_nascent_nature
    display: '&eNascent Nature &fBooster Pack'
    consume-on-success: true
    cooldown-milliseconds: 500
  the_menagerie:
    material: PAPER
    custom-model-data: 634000
    mythic-skill: nm_pack_open_the_menagerie
    display: '&6The Menagerie &fBooster Pack'
    consume-on-success: true
    cooldown-milliseconds: 500
  starter:
    material: PAPER
    custom-model-data: 635000
    mythic-skill: nm_pack_open_starter_pack
    display: '&9Starter &fBooster Pack'
    consume-on-success: true
    cooldown-milliseconds: 500
  helper:
    material: PAPER
    custom-model-data: 635010
    mythic-skill: nm_pack_open_helper_pack
    display: '&cHelper &fBooster Pack'
    consume-on-success: true
    cooldown-milliseconds: 500
