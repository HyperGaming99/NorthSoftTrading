name: NorthSoftTradingCards
version: '1.3.0'
main: de.northsoft.tradingcards.NorthSoftTradingCardsPlugin
api-version: '1.21'
authors: [NorthSoft]
description: Verbindet Trading Cards und Songkran-Wasserpistolen mit BetterMob.
depend: [BetterMob]

commands:
  nstradingcards:
    description: Verwaltung der NorthSoft Trading Cards
    usage: /nstradingcards give <Spieler> [Anzahl] [Pack] | givecard <Karte> <Spieler> [Anzahl] | display [Filter] [Spalten] | reload
    aliases: [nstc]
    permission: northsofttradingcards.admin

permissions:
  northsofttradingcards.admin:
    description: Erlaubt Give und Reload des Trading-Cards-Plugins
    default: op
